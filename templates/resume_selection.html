<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Resume Template</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px; }
        .template-card { border: 2px solid #ccc; padding: 20px; text-align: center; cursor: pointer; border-radius: 10px; background: rgba(255,255,255,0.8); }
        .template-card:hover { border-color: #007bff; }
        .template-card img { width: 100%; height: 150px; object-fit: cover; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Choose Your Resume Template</h2>
        <form action="/generate-resume-final" method="POST">
            <div class="grid">
                {% for i in range(1, 7) %}
                <label class="template-card">
                    <input type="radio" name="template" value="template{{ i }}" required>
                    <div>Template {{ i }}</div>
                </label>
                {% endfor %}
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button type="submit" class="btn">Generate Resume</button>
            </div>
        </form>
    </div>
</body>
</html>
